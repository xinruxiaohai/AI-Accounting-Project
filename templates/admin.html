<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通知发布台 · AI 记账管家</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css?v=0.10.2">
  <style>
    .admin-page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    .admin-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .admin-head h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-strong);
      margin: 0 0 4px;
    }
    .admin-head p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1023.98px) {
      .admin-grid { grid-template-columns: minmax(0, 1fr); }
    }
    .admin-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }
    .admin-card + .admin-card { margin-top: 20px; }
    .admin-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-strong);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .admin-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: var(--surface-2);
    }
    .editor-toolbar button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      border-radius: 6px;
      min-width: 32px;
      height: 30px;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .editor-toolbar button:hover {
      background: var(--surface-3);
      border-color: var(--line);
    }
    .editor-body {
      min-height: 200px;
      max-height: 420px;
      overflow-y: auto;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      background: var(--surface);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.7;
      outline: none;
    }
    .editor-body:focus { border-color: var(--brand-blue); }
    .editor-body:empty::before {
      content: attr(data-placeholder);
      color: var(--text-dim);
    }
    .editor-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 6px 0;
    }
    .editor-body ul, .editor-body ol { padding-left: 22px; }
    .cover-box {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .cover-preview {
      width: 120px;
      height: 76px;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--line-strong);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 12px;
      overflow: hidden;
      flex: none;
    }
    .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 620px;
      overflow-y: auto;
    }
    .admin-notice {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      background: var(--surface-2);
    }
    .admin-notice-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .admin-notice-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-strong);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .admin-notice-date {
      font-size: 12px;
      color: var(--text-dim);
      flex: none;
    }
    .admin-notice-body {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-muted);
      max-height: 72px;
      overflow: hidden;
      line-height: 1.6;
    }
    .admin-notice-body img { max-width: 100%; border-radius: 6px; }
    .admin-notice-foot {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .admin-empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
    }
    .admin-toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1080;
      min-width: 200px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: #fff;
      background: #16a34a;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .admin-toast.is-error { background: #dc2626; }
    .admin-toast.is-show { opacity: 1; transform: translateY(0); }
    .admin-count { font-size: 12px; color: var(--text-dim); }
    /* ---------- Tab 切换（v0.10：通知发布 / AI 反馈与记忆） ---------- */
    .admin-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .admin-tab {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .admin-tab:hover { color: var(--text-strong); }
    .admin-tab.is-active {
      color: var(--brand-blue);
      border-bottom-color: var(--brand-blue);
    }
    /* ---------- AI 反馈表 ---------- */
    .feedback-scroll {
      max-height: 620px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }
    .feedback-table {
      width: 100%;
      table-layout: fixed;
      margin: 0;
      font-size: 13px;
      border-collapse: collapse;
    }
    .feedback-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 9px 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: left;
      white-space: nowrap;
    }
    .feedback-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      color: var(--text-main);
    }
    .feedback-table tr:last-child td { border-bottom: 0; }
    .feedback-table tbody tr:hover { background: var(--surface-2); }
    .feedback-raw {
      font-weight: 600;
      color: var(--text-strong);
      word-break: break-word;
      line-height: 1.6;
    }
    .feedback-json {
      margin: 0;
      max-height: 88px;
      overflow: auto;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .feedback-meta {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      line-height: 1.7;
    }
    .feedback-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .feedback-status.is-pending { color: #b45309; background: #fef3c7; }
    .feedback-status.is-processed { color: #15803d; background: #dcfce7; }
    .feedback-source { font-size: 11px; color: var(--text-dim); }
  </style>
</head>
<body>
  <main class="admin-page">
    <header class="admin-head">
      <div>
        <h1>通知发布台</h1>
        <p>在这里写通知，前台点顶部信封就能看到；仅在开发期使用。</p>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="/">← 回到记账看板</a>
    </header>

    <div class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab is-active" role="tab" data-tab="notices"
              aria-selected="true">通知发布</button>
      <button type="button" class="admin-tab" role="tab" data-tab="feedback"
              aria-selected="false">AI 反馈与记忆</button>
    </div>

    <section id="pane-notices">
    <div class="admin-grid">
      <!-- 左：发布表单 -->
      <section>
        <div class="admin-card">
          <h2 class="admin-card-title" id="editor-title">写一条新通知</h2>

          <div class="mb-3">
            <label class="admin-label" for="notice-title">标题</label>
            <input id="notice-title" class="form-control" type="text" maxlength="80"
                   placeholder="例如：v0.06.2-DEV 上线，全新三栏看板与暗黑模式！">
            <div class="admin-hint"><span id="title-count">0</span> / 80</div>
          </div>

          <div class="mb-3">
            <label class="admin-label">正文（可加粗、列表、插图）</label>
            <div class="editor-toolbar" id="editor-toolbar">
              <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
              <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
              <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
              <button type="button" data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
              <button type="button" data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
              <button type="button" id="editor-image-btn" title="插入图片">🖼 图片</button>
              <button type="button" id="editor-clear" title="清空格式">清除格式</button>
            </div>
            <div id="notice-content" class="editor-body" contenteditable="true"
                 data-placeholder="正文支持图文混排，直接粘贴或点上面的按钮…"></div>
            <input id="content-image-input" type="file" accept="image/*" hidden>
          </div>

          <div class="mb-3">
            <label class="admin-label">封面图（可选）</label>
            <div class="cover-box">
              <div class="cover-preview" id="cover-preview">未选择</div>
              <div>
                <input id="cover-input" type="file" accept="image/*" class="form-control form-control-sm">
                <div class="admin-hint">上传后会显示在通知底部，最大 5MB。</div>
                <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="cover-clear">移除封面</button>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="admin-label" for="notice-date">发布时间（留空 = 现在）</label>
            <label class="date-field">
              <input id="notice-date" class="form-control" type="text" placeholder="年 / 月 / 日 时:分" autocomplete="off" readonly>
              <input class="date-native" type="datetime-local" aria-hidden="true" tabindex="-1" data-date-for="notice-date">
            </label>
          </div>

          <div class="d-flex align-items-center gap-3">
            <button type="button" class="btn btn-primary" id="publish-btn">发布通知</button>
            <button type="button" class="btn btn-outline-secondary d-none" id="cancel-edit-btn">取消编辑</button>
            <span class="admin-count" id="publish-hint"></span>
          </div>
        </div>
      </section>

      <!-- 右：已有通知 -->
      <section>
        <div class="admin-card">
          <h2 class="admin-card-title">
            已发布
            <span class="badge text-bg-secondary" id="notice-total">0</span>
          </h2>
          <div class="admin-list" id="notice-list"></div>
        </div>
      </section>
    </div>
    </section>

    <!-- AI 反馈与记忆（v0.10）：看 /api/feedback 列表，把处理完的反馈标记掉 -->
    <section id="pane-feedback" hidden>
      <div class="admin-card">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <h2 class="admin-card-title mb-0">
            AI 反馈与记忆
            <span class="badge text-bg-secondary" id="feedback-total">0</span>
          </h2>
          <div class="d-flex align-items-center gap-2">
            <select id="feedback-filter" class="form-select form-select-sm" style="width:auto">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="processed">已处理</option>
            </select>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="feedback-refresh">刷新</button>
          </div>
        </div>
        <p class="admin-hint mb-3">
          AI 解析错的句子和人工纠正结果都记在这里，状态 pending 的可以固化进 Prompt；
          每行点「标记已处理」即 PUT /api/feedback/&lt;id&gt; 改状态。
        </p>
        <div id="feedback-list"></div>
      </div>
    </section>
  </main>

  <div class="admin-toast" id="admin-toast"></div>

  <script>
    (function () {
      "use strict";

      var $ = function (id) { return document.getElementById(id); };
      var state = { notifications: [], imageUrl: "", publishing: false, editingId: null };

      function toast(message, isError) {
        var box = $("admin-toast");
        box.textContent = message;
        box.classList.toggle("is-error", !!isError);
        box.classList.add("is-show");
        window.clearTimeout(toast._timer);
        toast._timer = window.setTimeout(function () {
          box.classList.remove("is-show");
        }, 2600);
      }

      function escapeHtml(text) {
        return String(text == null ? "" : text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function request(url, options) {
        return fetch(url, options).then(function (response) {
          return response.json().catch(function () { return {}; }).then(function (data) {
            if (!response.ok) {
              throw new Error(data.error || "请求失败（" + response.status + "）");
            }
            return data;
          });
        });
      }

      /* ---------- 图片上传 ---------- */

      function uploadImage(file) {
        var form = new FormData();
        form.append("file", file);
        return request("/api/upload", { method: "POST", body: form }).then(function (data) {
          return data.url;
        });
      }

      /* ---------- 富文本编辑器 ---------- */

      var editor = $("notice-content");

      function focusEditor() {
        editor.focus();
      }

      function execCommand(cmd) {
        focusEditor();
        document.execCommand(cmd, false, null);
      }

      $("editor-toolbar").addEventListener("click", function (event) {
        var button = event.target.closest("button[data-cmd]");
        if (!button) { return; }
        execCommand(button.getAttribute("data-cmd"));
      });

      $("editor-clear").addEventListener("click", function () {
        focusEditor();
        document.execCommand("removeFormat", false, null);
      });

      $("editor-image-btn").addEventListener("click", function () {
        $("content-image-input").click();
      });

      $("content-image-input").addEventListener("change", function () {
        var file = this.files && this.files[0];
        this.value = "";
        if (!file) { return; }
        toast("图片上传中…");
        uploadImage(file)
          .then(function (url) {
            focusEditor();
            document.execCommand("insertHTML", false,
              '<img src="' + escapeHtml(url) + '" alt="通知配图">');
            toast("图片已插入正文");
          })
          .catch(function (error) { toast(error.message, true); });
      });

      /* ---------- 封面 ---------- */

      $("cover-input").addEventListener("change", function () {
        var file = this.files && this.files[0];
        if (!file) { return; }
        toast("封面上传中…");
        uploadImage(file)
          .then(function (url) {
            state.imageUrl = url;
            $("cover-preview").innerHTML = '<img src="' + escapeHtml(url) + '" alt="封面预览">';
            toast("封面已上传");
          })
          .catch(function (error) { toast(error.message, true); });
      });

      $("cover-clear").addEventListener("click", function () {
        state.imageUrl = "";
        $("cover-preview").textContent = "未选择";
        $("cover-input").value = "";
      });

      /* ---------- 发布 ---------- */

      $("notice-title").addEventListener("input", function () {
        $("title-count").textContent = String(this.value.length);
      });

      function setPublishing(busy) {
        state.publishing = busy;
        var button = $("publish-btn");
        button.disabled = busy;
        button.textContent = busy ? "保存中…" : (state.editingId ? "保存修改" : "发布通知");
        $("publish-hint").textContent = busy ? "正在写入数据库…" : "";
      }

      function resetForm() {
        state.editingId = null;
        $("editor-title").textContent = "写一条新通知";
        $("notice-title").value = "";
        $("title-count").textContent = "0";
        editor.innerHTML = "";
        setNoticeDateValue("");
        state.imageUrl = "";
        $("cover-preview").textContent = "未选择";
        $("cover-input").value = "";
        $("publish-btn").textContent = "发布通知";
        $("cancel-edit-btn").classList.add("d-none");
      }

      function fillForm(item) {
        state.editingId = item.id;
        $("editor-title").textContent = "编辑通知 #" + item.id;
        $("notice-title").value = item.title || "";
        $("title-count").textContent = String(($("notice-title").value || "").length);
        editor.innerHTML = item.content || "";
        state.imageUrl = item.image_url || "";
        if (state.imageUrl) {
          $("cover-preview").innerHTML = '<img src="' + escapeHtml(state.imageUrl) + '" alt="封面预览">';
        } else {
          $("cover-preview").textContent = "未选择";
        }
        $("cover-input").value = "";
        var dateText = item.publish_date ? String(item.publish_date).slice(0, 16) : "";
        setNoticeDateValue(dateText);
        $("publish-btn").textContent = "保存修改";
        $("cancel-edit-btn").classList.remove("d-none");
        window.scrollTo({ top: 0, behavior: "smooth" });
        toast("已载入通知 #" + item.id + "，改完点「保存修改」");
      }

      function setNoticeDateValue(value) {
        var display = value ? String(value).slice(0, 16).replace("T", " ") : "";
        $("notice-date").value = display;
        var native = document.querySelector('.date-native[data-date-for="notice-date"]');
        if (native) {
          native.value = display ? display.replace(" ", "T") : "";
        }
      }

      var noticeDateNative = document.querySelector('.date-native[data-date-for="notice-date"]');
      if (noticeDateNative) {
        noticeDateNative.addEventListener("change", function () {
          setNoticeDateValue(noticeDateNative.value);
        });
      }

      $("cancel-edit-btn").addEventListener("click", function () {
        resetForm();
        toast("已取消编辑");
      });

      $("publish-btn").addEventListener("click", function () {
        if (state.publishing) { return; }
        var title = $("notice-title").value.trim();
        var content = editor.innerHTML.trim();
        if (!title) {
          toast("标题不能为空", true);
          $("notice-title").focus();
          return;
        }
        if (!content || !editor.textContent.trim()) {
          toast("正文不能为空", true);
          editor.focus();
          return;
        }

        var payload = { title: title, content: content, image_url: state.imageUrl || "" };
        var dateValue = $("notice-date").value.trim();
        if (dateValue) {
          payload.publish_date = dateValue.replace("T", " ") + ":00";
        }

        var editingId = state.editingId;
        var url = editingId ? "/api/notifications/" + editingId : "/api/notifications";
        setPublishing(true);
        request(url, {
          method: editingId ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then(function () {
            toast(editingId
              ? "通知 #" + editingId + " 已更新，前台刷新即可看到"
              : "发布成功，前台刷新即可看到");
            resetForm();
            return loadList();
          })
          .catch(function (error) { toast(error.message, true); })
          .then(function () { setPublishing(false); });
      });

      /* ---------- 列表 ---------- */

      function renderList() {
        var box = $("notice-list");
        $("notice-total").textContent = String(state.notifications.length);
        if (!state.notifications.length) {
          box.innerHTML = '<div class="admin-empty">还没有通知，左边发布第一条吧。</div>';
          return;
        }
        box.innerHTML = state.notifications.map(function (item) {
          var date = item.publish_date ? String(item.publish_date).slice(0, 16) : "";
          var plain = String(item.content || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          return (
            '<article class="admin-notice" data-id="' + item.id + '">' +
              '<div class="admin-notice-head">' +
                '<span class="admin-notice-title">' + escapeHtml(item.title) + "</span>" +
                '<span class="admin-notice-date">' + escapeHtml(date) + "</span>" +
              "</div>" +
              '<div class="admin-notice-body">' + (plain ? escapeHtml(plain.slice(0, 140)) : "（无正文）") + "</div>" +
              '<div class="admin-notice-foot">' +
                '<span class="admin-count">#' + item.id + (item.image_url ? " · 有配图" : "") + "</span>" +
                '<button type="button" class="btn btn-sm btn-outline-primary" data-edit="' + item.id + '">编辑</button>' +
                '<button type="button" class="btn btn-sm btn-outline-danger" data-del="' + item.id + '">删除</button>' +
              "</div>" +
            "</article>"
          );
        }).join("");
      }

      function loadList() {
        return request("/api/notifications")
          .then(function (data) {
            state.notifications = data.notifications || [];
            renderList();
          })
          .catch(function (error) {
            $("notice-list").innerHTML = '<div class="admin-empty">' + escapeHtml(error.message) + "</div>";
          });
      }

      $("notice-list").addEventListener("click", function (event) {
        var editButton = event.target.closest("[data-edit]");
        if (editButton) {
          var targetId = Number(editButton.getAttribute("data-edit"));
          var target = state.notifications.filter(function (item) { return item.id === targetId; })[0];
          if (target) { fillForm(target); }
          return;
        }

        var button = event.target.closest("[data-del]");
        if (!button) { return; }
        var id = button.getAttribute("data-del");
        if (!window.confirm("确定删除通知 #" + id + " 吗？")) { return; }
        button.disabled = true;
        request("/api/notifications/" + id, { method: "DELETE" })
          .then(function () {
            toast("已删除");
            if (String(state.editingId) === String(id)) { resetForm(); }
            return loadList();
          })
          .catch(function (error) { button.disabled = false; toast(error.message, true); });
      });

      loadList();
    })();
  </script>

  <script>
    /* ---------- Tab 切换 + AI 反馈与记忆（v0.10） ---------- */
    (function () {
      "use strict";

      var $ = function (id) { return document.getElementById(id); };
      var state = { items: [], loaded: false, loading: false };

      function toast(message, isError) {
        var box = $("admin-toast");
        box.textContent = message;
        box.classList.toggle("is-error", !!isError);
        box.classList.add("is-show");
        window.clearTimeout(toast._timer);
        toast._timer = window.setTimeout(function () {
          box.classList.remove("is-show");
        }, 2600);
      }

      function escapeHtml(text) {
        return String(text == null ? "" : text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function request(url, options) {
        return fetch(url, options).then(function (response) {
          return response.json().catch(function () { return {}; }).then(function (data) {
            if (!response.ok) {
              throw new Error(data.error || "请求失败（" + response.status + "）");
            }
            return data;
          });
        });
      }

      /* ---------- Tab 切换 ---------- */

      var tabs = Array.prototype.slice.call(document.querySelectorAll(".admin-tab"));

      function switchTab(name) {
        tabs.forEach(function (tab) {
          var active = tab.getAttribute("data-tab") === name;
          tab.classList.toggle("is-active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });
        $("pane-notices").hidden = name !== "notices";
        $("pane-feedback").hidden = name !== "feedback";
        // 第一次进反馈 Tab 才拉数据，避免每次进 /admin 都多打一个请求
        if (name === "feedback" && !state.loaded) { loadFeedback(); }
      }

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          switchTab(tab.getAttribute("data-tab"));
        });
      });

      /* ---------- 反馈列表 ---------- */

      // 解析结果可能是 JSON 字符串，也可能是历史脏数据；尽量格式化成缩进 JSON，
      // 实在解析不了就原样展示，绝不让列表因为一条脏数据崩掉。
      function formatJson(value) {
        if (value == null || value === "") { return "—"; }
        if (typeof value === "object") { return JSON.stringify(value, null, 2); }
        try {
          return JSON.stringify(JSON.parse(value), null, 2);
        } catch (error) {
          return String(value);
        }
      }

      function renderFeedback() {
        var box = $("feedback-list");
        $("feedback-total").textContent = String(state.items.length);
        if (!state.items.length) {
          box.innerHTML = '<div class="admin-empty">还没有 AI 反馈，记账页解析出错时记一条，这里就能看到。</div>';
          return;
        }
        box.innerHTML =
          '<div class="feedback-scroll"><table class="feedback-table">' +
            "<colgroup>" +
              '<col style="width:24%"><col style="width:26%"><col style="width:26%">' +
              '<col style="width:12%"><col style="width:12%">' +
            "</colgroup>" +
            "<thead><tr>" +
              "<th>原始文本</th><th>解析 JSON</th><th>纠正 JSON</th><th>状态 / 时间</th><th>操作</th>" +
            "</tr></thead><tbody>" +
            state.items.map(function (item) {
              var pending = item.status === "pending";
              var created = item.created_at ? String(item.created_at).slice(0, 16) : "";
              var processed = item.updated_at ? String(item.updated_at).slice(0, 16) : "";
              return (
                '<tr data-id="' + item.id + '">' +
                  "<td>" +
                    '<div class="feedback-raw">' + escapeHtml(item.raw_text) + "</div>" +
                    (item.source ? '<div class="feedback-source">来源：' + escapeHtml(item.source) + "</div>" : "") +
                  "</td>" +
                  '<td><pre class="feedback-json">' + escapeHtml(formatJson(item.parsed_json)) + "</pre></td>" +
                  '<td><pre class="feedback-json">' + escapeHtml(formatJson(item.corrected_json)) + "</pre></td>" +
                  "<td>" +
                    '<span class="feedback-status ' + (pending ? "is-pending" : "is-processed") + '">' +
                      (pending ? "待处理" : "已处理") +
                    "</span>" +
                    '<div class="feedback-meta">#' + item.id + " · " + escapeHtml(created) +
                    (!pending && processed ? "<br>处理于 " + escapeHtml(processed) : "") +
                    "</div>" +
                  "</td>" +
                  "<td>" +
                    (pending
                      ? '<button type="button" class="btn btn-sm btn-outline-primary" data-process="' + item.id + '">标记已处理</button>'
                      : '<span class="feedback-meta">—</span>') +
                  "</td>" +
                "</tr>"
              );
            }).join("") +
          "</tbody></table></div>";
      }

      function loadFeedback() {
        if (state.loading) { return Promise.resolve(); }
        state.loading = true;
        var status = $("feedback-filter").value;
        var url = "/api/feedback" + (status ? "?status=" + encodeURIComponent(status) : "");
        return request(url)
          .then(function (data) {
            state.items = data.items || [];
            state.loaded = true;
            renderFeedback();
          })
          .catch(function (error) {
            $("feedback-list").innerHTML =
              '<div class="admin-empty">' + escapeHtml(error.message) + "</div>";
          })
          .then(function () { state.loading = false; });
      }

      $("feedback-refresh").addEventListener("click", function () {
        loadFeedback().then(function () { toast("反馈列表已刷新"); });
      });

      $("feedback-filter").addEventListener("change", function () { loadFeedback(); });

      $("feedback-list").addEventListener("click", function (event) {
        var button = event.target.closest("[data-process]");
        if (!button) { return; }
        var id = button.getAttribute("data-process");
        button.disabled = true;
        request("/api/feedback/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "processed" }),
        })
          .then(function () {
            toast("反馈 #" + id + " 已标记为已处理");
            return loadFeedback();
          })
          .catch(function (error) {
            button.disabled = false;
            toast(error.message, true);
          });
      });
    })();
  </script>
</body>
</html>
