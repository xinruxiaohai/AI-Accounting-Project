<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI记账管家</title>
  <!-- Bootstrap 5 的 CSS 走 CDN（本机已验证 jsdelivr 返回 200） -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自己的少量样式放在 Bootstrap 之后，才能覆盖它 -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar navbar-expand navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">AI记账管家</span>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text text-white-50 small d-none d-md-inline">记一笔，看清钱都去哪了</span>
        <!-- 账户管理入口：点开弹窗，能看每个账户余额并手动改 -->
        <button id="manage-accounts-btn" class="btn btn-sm btn-light" type="button">账户管理</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <!-- 统计卡片：数字由 script.js 调 /api/statistics 填进来 -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="text-muted small mb-1">总收入</div>
            <div class="stat-number text-success" id="stat-income">¥0.00</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="text-muted small mb-1">总支出</div>
            <div class="stat-number text-danger" id="stat-expense">¥0.00</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="text-muted small mb-1">总余额</div>
            <!-- 负数时 script.js 会给它换成 text-danger（红色） -->
            <div class="stat-number text-primary" id="stat-balance">¥0.00</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 记一笔 / 编辑表单 -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h6 text-muted mb-3" id="form-title">记一笔</h2>

        <!-- onsubmit 返回 false：防止回车触发表单默认提交导致页面刷新 -->
        <form class="row g-2" onsubmit="return false;">
          <div class="col-12 col-md-3">
            <label class="form-label small mb-1">收支类型</label>
            <!-- btn-check + label：用单选按钮做成"分段按钮"的样子，值仍然是 radio -->
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="record-type" id="type-expense" value="expense" checked>
              <label class="btn btn-outline-danger" for="type-expense">支出</label>
              <input type="radio" class="btn-check" name="record-type" id="type-income" value="income">
              <label class="btn btn-outline-success" for="type-income">收入</label>
            </div>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small mb-1" for="amount">金额</label>
            <input id="amount" class="form-control" type="number" step="0.01" min="0.01" placeholder="例如 25.5">
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small mb-1" for="category">分类</label>
            <!-- 选项由后端注入，见 app.py 的 index() -->
            <select id="category" class="form-select">
              {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small mb-1" for="account">支付账户</label>
            <select id="account" class="form-select">
              {% for a in accounts %}
              <option value="{{ a }}">{{ a }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="date">日期</label>
            <!-- 默认填今天，由后端传入 today -->
            <input id="date" class="form-control" type="date" value="{{ today }}">
          </div>

          <div class="col-12">
            <label class="form-label small mb-1" for="note">备注</label>
            <input id="note" class="form-control" type="text" placeholder="例如 午饭（可不填）">
          </div>

          <div class="col-12 d-flex gap-2 mt-2">
            <button id="submit-btn" class="btn btn-primary" type="button">记一笔</button>
            <button id="cancel-btn" class="btn btn-outline-secondary d-none" type="button">取消编辑</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 历史记录 + 账户筛选 -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap align-items-center justify-content-between gap-2">
        <span class="text-muted small fw-semibold">账单流水</span>
        <div class="d-flex align-items-center gap-2">
          <label class="form-label small mb-0 text-muted" for="filter-account">按账户筛选</label>
          <select id="filter-account" class="form-select form-select-sm" style="width: 150px;">
            <option value="">全部账户</option>
            {% for a in accounts %}
            <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="card-body p-0">
        <table class="table table-hover table-bordered align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width: 110px;">日期</th>
              <th style="width: 80px;">类型</th>
              <th>分类</th>
              <th style="width: 100px;">账户</th>
              <th class="text-end" style="width: 120px;">金额</th>
              <th>备注</th>
              <th class="text-end" style="width: 150px;">操作</th>
            </tr>
          </thead>
          <tbody id="record-list"></tbody>
        </table>
      </div>
      <div class="card-footer bg-white text-center text-muted small d-none" id="empty-tip">
        还没有记录，先记一笔吧
      </div>
    </div>

  </div>

  <!-- 账户管理弹窗：列出所有账户余额，可逐行手动修改 -->
  <div class="modal fade" id="account-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">账户管理</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-2">
            余额会随记账自动增减；如果和实际对不上，直接在这里改成正确的数字。
          </p>
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 90px;">账户</th>
                <th>当前余额</th>
                <th style="width: 150px;">改为</th>
                <th style="width: 70px;"></th>
              </tr>
            </thead>
            <tbody id="account-list"></tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 的 JS（弹窗需要它），必须放在 script.js 之前 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
