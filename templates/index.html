<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI记账管家</title>
  <!-- Bootstrap 5 已下载到 static/vendor，本地引用，断网也能用 -->
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <!-- 自己的样式放在 Bootstrap 之后，才能覆盖它 -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Toast 轻提示容器：由 script.js 往里塞消息，不用 alert -->
<div class="toast-stack" id="toast-stack"></div>

<div class="app">

  <!-- ================= 左侧侧边栏 ================= -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">AI</span>
      <span class="brand-text">AI记账管家</span>
    </div>

    <nav class="sidebar-nav">
      <!-- data-page 对应下面 page-xxx 的 id，点一下切换显示 -->
      <a class="nav-item active" href="#" data-page="home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-6h5v6"></path>
        </svg>
        <span>首页</span>
      </a>
      <a class="nav-item" href="#" data-page="calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path>
        </svg>
        <span>日历</span>
      </a>
      <a class="nav-item" href="#" data-page="assets">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6.5" width="18" height="12" rx="2.5"></rect><path d="M3 10.5h18"></path><circle cx="16.5" cy="14.5" r="1.2"></circle>
        </svg>
        <span>资产</span>
      </a>
      <a class="nav-item" href="#" data-page="profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20.5c1.6-3.4 4.3-5 7.5-5s5.9 1.6 7.5 5"></path>
        </svg>
        <span>我的</span>
      </a>
    </nav>

    <div class="sidebar-footer">v0.05-DEV · 开发中</div>
  </aside>

  <!-- ================= 右侧主内容区 ================= -->
  <div class="main">

    <!-- 顶部导航：左标题 + 右主按钮 -->
    <header class="topbar">
      <h1 class="topbar-title" id="page-title">首页</h1>
      <button class="btn btn-primary btn-add" type="button" id="add-record-btn">
        + 记一笔
      </button>
    </header>

    <div class="content">

      <!-- ============ 首页 ============ -->
      <section class="page active" id="page-home">

        <!-- 统计卡片：数字由 script.js 调 /api/statistics 填 -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-md-4">
            <div class="stat-card">
              <div class="stat-label">总收入</div>
              <div class="stat-number text-success" id="stat-income">¥0.00</div>
              <div class="stat-hint">已记录的收入合计</div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="stat-card">
              <div class="stat-label">总支出</div>
              <div class="stat-number text-danger" id="stat-expense">¥0.00</div>
              <div class="stat-hint">已记录的支出合计</div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="stat-card">
              <div class="stat-label">总余额</div>
              <div class="stat-number text-primary" id="stat-balance">¥0.00</div>
              <div class="stat-hint">各账户余额之和</div>
            </div>
          </div>
        </div>

        <!-- 账单列表 -->
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">账单流水</span>
            <div class="panel-tools">
              <label class="form-label mb-0" for="filter-account">账户</label>
              <!-- 选项由 script.js 按大类用 optgroup 重建 -->
              <select id="filter-account" class="form-select form-select-sm">
                <option value="">全部账户</option>
                {% for a in accounts %}
                <option value="{{ a }}">{{ a }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th class="col-time">时间</th>
                  <th class="col-type">类型</th>
                  <th>分类</th>
                  <th class="col-account">账户</th>
                  <th class="text-end col-amount">金额</th>
                  <th>备注</th>
                  <th class="text-end col-action">操作</th>
                </tr>
              </thead>
              <tbody id="record-list">
                <tr id="empty-row">
                  <td colspan="7" class="empty-cell">
                    还没有记录，点右上角「+ 记一笔」开始吧
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </section>

      <!-- ============ 日历 ============ -->
      <section class="page" id="page-calendar">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title" id="calendar-title">本月支出</span>
            <span class="panel-sub">格子里的数字是当天支出合计</span>
          </div>
          <div class="calendar-wrap">
            <div class="calendar-week">
              <span>一</span><span>二</span><span>三</span><span>四</span>
              <span>五</span><span>六</span><span>日</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </div>
        </div>
      </section>

      <!-- ============ 资产 ============ -->
      <section class="page" id="page-assets">

        <!-- 上：按大类分组的账户卡片 -->
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">我的账户</span>
            <div class="panel-tools">
              <button class="btn btn-sm btn-outline-secondary" type="button" id="open-category-btn">分类管理</button>
              <button class="btn btn-sm btn-primary" type="button" id="open-account-btn">+ 新增账户</button>
            </div>
          </div>
          <!-- 卡片由 script.js 按 group 渲染，点卡片选中账户 -->
          <div class="account-groups" id="account-groups">
            <p class="empty-cell">正在加载账户…</p>
          </div>
        </div>

        <!-- 下：选中账户的专属流水 -->
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title" id="detail-title">账户流水</span>
            <div class="panel-tools">
              <button class="btn btn-sm btn-primary" type="button" id="quick-add-btn" disabled>在此账户下记一笔</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th class="col-time">时间</th>
                  <th class="col-type">类型</th>
                  <th>分类</th>
                  <th class="text-end col-amount">金额</th>
                  <th>备注</th>
                  <th class="text-end col-action">操作</th>
                </tr>
              </thead>
              <tbody id="account-records">
                <tr>
                  <td colspan="6" class="empty-cell">先在上方点一个账户，这里会显示它的流水</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </section>

      <!-- ============ 我的 ============ -->
      <section class="page" id="page-profile">
        <div class="placeholder-box">
          <div class="placeholder-icon">👤</div>
          <div class="placeholder-title">我的页面开发中</div>
          <div class="placeholder-text">之后会放个人信息、数据导出和偏好设置。</div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- ================= 记账弹窗 ================= -->
<div class="modal fade" id="record-modal" tabindex="-1" aria-labelledby="record-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="record-modal-title">记一笔</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>

      <div class="modal-body">
        <form id="record-form" onsubmit="return false;">

          <!-- 收支类型：btn-check + label，看起来是分段按钮，值仍是 radio -->
          <div class="mb-3">
            <label class="form-label">收支类型</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="record-type" id="type-expense" value="expense" checked>
              <label class="btn btn-outline-danger" for="type-expense">支出</label>
              <input type="radio" class="btn-check" name="record-type" id="type-income" value="income">
              <label class="btn btn-outline-success" for="type-income">收入</label>
              <input type="radio" class="btn-check" name="record-type" id="type-transfer" value="transfer">
              <label class="btn btn-outline-primary" for="type-transfer">转账</label>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="amount">金额</label>
              <div class="input-group">
                <span class="input-group-text">¥</span>
                <!-- type="text" 才能输入公式，比如 15.5+20*2 -->
                <input id="amount" class="form-control" type="text" inputmode="decimal"
                       placeholder="25.50 或 15.5+20*2" autocomplete="off">
              </div>
              <!-- 公式实时计算结果显示在这里 -->
              <div class="formula-hint" id="amount-hint"></div>
            </div>

            <!-- 一级分类：选项由 script.js 用分类表重建（value 是分类 id） -->
            <div class="col-6" id="category-col">
              <label class="form-label" for="category">一级分类</label>
              <select id="category" class="form-select">
                {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- 二级分类：只有当选中一级分类真的有子分类时才显示 -->
            <div class="col-6 d-none" id="sub-category-wrap">
              <label class="form-label" for="sub-category">二级分类</label>
              <select id="sub-category" class="form-select"></select>
            </div>

            <div class="col-6">
              <label class="form-label" for="account" id="account-label">账户</label>
              <!-- 选项由 script.js 按大类用 <optgroup> 重建 -->
              <select id="account" class="form-select">
                {% for a in accounts %}
                <option value="{{ a }}">{{ a }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- 转账专用：转入账户（平时隐藏） -->
            <div class="col-6 d-none" id="to-account-wrap">
              <label class="form-label" for="to-account">转入账户</label>
              <select id="to-account" class="form-select"></select>
            </div>

            <!-- 转账专用：手续费（平时隐藏，默认 0） -->
            <div class="col-6 d-none" id="fee-wrap">
              <label class="form-label" for="fee">手续费</label>
              <div class="input-group">
                <span class="input-group-text">¥</span>
                <input id="fee" class="form-control" type="number" step="0.01" min="0" value="0">
              </div>
            </div>

            <div class="col-6">
              <label class="form-label" for="record-time">时间</label>
              <!-- datetime-local：浏览器给出「年-月-日 时:分」选择器，精确到分钟 -->
              <input id="record-time" class="form-control" type="datetime-local" value="{{ now }}">
            </div>

            <div class="col-12">
              <label class="form-label" for="note">备注</label>
              <input id="note" class="form-control" type="text" placeholder="例如：午饭（可不填）">
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="save-btn">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= 新增账户弹窗 ================= -->
<div class="modal fade" id="account-modal" tabindex="-1" aria-labelledby="account-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="account-modal-title">新增账户</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="new-account-name">账户名称</label>
          <input id="new-account-name" class="form-control" type="text" placeholder="例如：招行卡">
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-account-group">账户大类</label>
          <select id="new-account-group" class="form-select">
            <option value="资金账户">资金账户</option>
            <option value="储蓄账户">储蓄账户</option>
            <option value="投资账户">投资账户</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="new-account-balance">初始余额</label>
          <div class="input-group">
            <span class="input-group-text">¥</span>
            <input id="new-account-balance" class="form-control" type="number" step="0.01" value="0">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="save-account-btn">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= 分类管理弹窗 ================= -->
<div class="modal fade" id="category-modal" tabindex="-1" aria-labelledby="category-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="category-modal-title">分类管理</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <!-- 新增分类：名字 + 挂到哪个一级分类下（留空就是一级分类） -->
        <div class="category-add">
          <input id="new-category-name" class="form-control" type="text" placeholder="新分类名称">
          <select id="new-category-parent" class="form-select">
            <option value="">作为一级分类</option>
          </select>
          <button class="btn btn-primary" type="button" id="add-category-btn">添加</button>
        </div>
        <!-- 分类树由 script.js 渲染，每个节点带删除按钮 -->
        <ul class="category-tree" id="category-tree"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 的 JS（弹窗靠它），必须在使用弹窗的标签之后加载 -->
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<!-- math.js：只用来算金额里的公式，本地引用，不用 eval -->
<script src="/static/vendor/math.min.js"></script>
<!-- 业务逻辑：切页、统计卡片、账单表格、记账弹窗、资产页、分类管理、日历 -->
<script src="/static/script.js"></script>

</body>
</html>
